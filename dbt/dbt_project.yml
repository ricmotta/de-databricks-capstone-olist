name: olist_capstone
version: "1.0.0"
config-version: 2
profile: olist_capstone

model-paths: ["models"]
macro-paths: ["macros"]
on-run-start:
  - "{{ create_mask_zip_prefix() }}"
  - "{{ create_mask_city() }}"

models:
  olist_capstone:
    silver:
      +schema: "olist_{{ var('env', 'dev') }}_silver"
    gold:
      +schema: "olist_{{ var('env', 'dev') }}_gold"
      +materialized: table
