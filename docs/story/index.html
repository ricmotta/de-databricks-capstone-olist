<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order #6,535</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one 16:9 stage like a video player, controls and chapter list under it. */
:root{
  --ink:#1E4E8C; --mid:#5B8FD1; --light:#A9C6EC; --late:#E0452B; --grey:#D6D6D0; --paper:#F7F7F4;
  --page:#ECEDEA; --page-fg:#1E2A3A; --page-muted:#5d6878; --chip:#ffffff; --line:rgba(30,78,140,.16);
  --serif:"Newsreader",Georgia,"Times New Roman",serif; --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#10161F;--page-fg:#E6EAF0;--page-muted:#9AA6B6;--chip:#1A2330;--line:rgba(169,198,236,.18);color-scheme:dark}}
:root[data-theme="dark"]{--page:#10161F;--page-fg:#E6EAF0;--page-muted:#9AA6B6;--chip:#1A2330;--line:rgba(169,198,236,.18);color-scheme:dark}
body{background:var(--page);color:var(--page-fg);font-family:var(--sans)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.head h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,3vw,2.2rem);margin:0;text-wrap:balance}
.head p{margin:0;color:var(--page-muted);font-size:.92rem}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:var(--paper);box-shadow:0 2px 6px rgba(16,32,64,.10),0 18px 48px rgba(16,32,64,.18)}
.stage svg{display:block;width:100%;height:100%}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:500;font-size:.9rem;border:1px solid var(--line);background:var(--chip);color:var(--page-fg);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;box-shadow:0 1px 2px rgba(16,32,64,.08)}
.btn:focus-visible,.chap button:focus-visible,#scrub:focus-visible{outline:2px solid var(--mid);outline-offset:2px}
#scrub{flex:1;min-width:140px;accent-color:#5B8FD1}
.time{font-variant-numeric:tabular-nums;color:var(--page-muted);font-size:.85rem;min-width:84px;text-align:right}
.chap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:8px}
.chap button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--chip);color:var(--page-fg);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.chap button small{color:var(--page-muted);font-size:.72rem;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.chap button span{font-size:.84rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap button[aria-current="true"]{border-color:#5B8FD1;box-shadow:inset 0 0 0 1px #5B8FD1}
.chap button.late[aria-current="true"]{border-color:#E0452B;box-shadow:inset 0 0 0 1px #E0452B}
.note{color:var(--page-muted);font-size:.8rem;margin:0}
/* stage text */
.serif{font-family:var(--serif)} .sans{font-family:var(--sans)}
</style>

</head>

        <circle cx="699" cy="232" r="34" fill="none" stroke="#1E4E8C" stroke-width="7" opacity=".7"/>

  const dl1 = mk('text', { x: 830, y: 548, class: 'sans', 'font-size': 19, 'font-weight': 600, fill: INK, opacity: 0 }, dc); dl1.textContent = '4.5% under 100 km';

  // ---------- trend ----------
  const MONTHS = ['2017-02', '2017-03', '2017-04', '2017-05', '2017-06', '2017-07', '2017-08', '2017-09', '2017-10', '2017-11', '2017-12', '2018-01', '2018-02', '2018-03', '2018-04', '2018-05', '2018-06', '2018-07', '2018-08'];

  const TX = (i) => 220 + i * (1180 / (MONTHS.length - 1)), TY = (v) => 690 - v / .18 * 440;

  const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  MONTHS.forEach((m, i) => { if (i % 3 === 0) mk('text', { x: TX(i), y: 726, 'text-anchor': 'middle', 'font-size': 20, fill: INK, opacity: .7 }, ax).textContent = MN[+m.slice(5) - 1] + " '" + m.slice(2, 4); });
  const tl = $('trendLine'); tl.setAttribute('d', 'M' + RATES.map((v, i) => `${TX(i)},${TY(v)}`).join('L')); const TL = tl.getTotalLength();
  const pin = (i, t1, t2, anc = 'middle', dx = 0) => { const g = mk('g', { opacity: 0 }, $('trendPins')); const x = TX(i), y = TY(RATES[i]); mk('line', { x1: x, x2: x, y1: y - 12, y2: y - 70, stroke: LATE, 'stroke-width': 3 }, g); mk('circle', { cx: x, cy: y, r: 11, fill: LATE, filter: 'url(#shs)' }, g); mk('circle', { cx: x, cy: y - 78, r: 9, fill: LATE }, g); mk('text', { x: x + dx, y: y - 100, 'text-anchor': anc, class: 'sans', 'font-size': 24, 'font-weight': 600, fill: LATE }, g).textContent = t1; if (t2) mk('text', { x: x + dx, y: y - 128, 'text-anchor': anc, class: 'sans', 'font-size': 18, fill: INK, opacity: .75 }, g).textContent = t2; return g; };
  const pins = [pin(10, 'Dec 2017 · 12.7%', 'Black Friday & Christmas', 'end', 14), pin(13, 'Mar 2018 · 16.5%')];

  // ---------- stars ----------
  const stars = Array.from({ length: 5 }, (_, i) => { const g = mk('g', {}, $('stars')); const bg = mk('use', { href: '#star', x: 180 + i * 72, y: 318, width: 58, height: 58, fill: '#D6D6D0' }, g); const fg = mk('use', { href: '#star', x: 180 + i * 72, y: 318, width: 58, height: 58, fill: INK }, g); return { fg }; });

  // ---------- caption / chapter ----------

  const CAPS = [[7, 10, 'Every order comes with a promise.'], [16, 20, 'Most arrive early. On average, 12 days before the promise.'], [41, 45, 'The delay is born on the road, not at the seller.'], [65, 68, 'Peaks follow demand peaks.']];
  function caption(t) {

  }
  const chapPill = $('chapPill'), chapText = $('chapText');
  function chapter(t) {
    const i = CHAPTERS.findIndex((c) => t >= c.t && t < c.end); const c = CHAPTERS[Math.max(0, i)];

  function render(t) {

    // ---- route group visible scenes 1-3 and 8

    const fp = t >= 78 ? 1 : ease(seg(t, 6, 7));

    else $('promiseCounter').textContent = 'Promised: 24 days';

    // ---- main box

    if (t >= 78) { bo = seg(t, 78.4, 79.2); const p = inOut(seg(t, 84, 86.5)); bx = lerp(200, 1065, p); bs = 1.15; }
    mainG.setAttribute('opacity', bo); boxAt(bx, bs, late);
    $('orderTag').setAttribute('opacity', Math.min(seg(t, 20.4, 21.2), 1 - seg(t, 30, 30.6)));
    $('orderTag').setAttribute('fill', late ? LATE : INK);
    const lateFlag = t >= 20 && t < 30.6 && bx > 1180;
    flagColor(lateFlag ? LATE : INK);
    $('dim').setAttribute('opacity', .07 * Math.min(seg(t, 24.6, 26), 1 - seg(t, 44.4, 45.4)));

    // ---- scene 2 minis
    minis.forEach((m, i) => {
      const st = 10.4 + i * .3, p = seg(t, st, st + 1.5);
      const vis = t >= st && t < 20.5 ? 1 - seg(t, st + 1.5, st + 1.9) : 0;
      const x = lerp(200, 920, inOut(p)), y = 520 - (i % 2) * 8 - 10 * seg(t, st + 1.5, st + 1.9);
      set(m, { x: x - 22, y: y - 42, opacity: vis });
    });
    $('deliveredIn').setAttribute('opacity', win(t, 12, 20.4, .6));
    set($('gap'), { opacity: win(t, 14.5, 20.4, .6) });
    $('bigDelivered').setAttribute('opacity', win(t, 10.6, 20.2, .6));
    $('bigDeliveredN').textContent = fmtInt(96470 * ease(seg(t, 10.8, 13.4)));
    // ---- scene 3 big late
    $('bigLate').setAttribute('opacity', win(t, 25.4, 30.4, .6));
    $('bigLateN').textContent = (6.8 * ease(seg(t, 25.4, 27.4))).toFixed(1) + '%';

    // ---- scene 4 stages
    $('stages').setAttribute('opacity', win(t, 30.6, 45, .6));
    const growBar = (bar, a, b) => {
      bar.els.forEach(({ r, s, v }, i) => { const total = bar.total; const p = seg(t, a + (b - a) * s / total, a + (b - a) * (s + v) / total); set(r, { width: Math.max(0, SX(s + v * p) - SX(s) - 4) }); });
      bar.lbl.setAttribute('opacity', seg(t, b, b + .5));
      const tr = bar.els[2]; set(bar.inner, { x: SX(tr.s) + 16, opacity: seg(t, b - .2, b + .4) });
    };
    growBar(barOn, 31.4, 34); growBar(barLate, 34.4, 38.4);
    const pulse = t > 38.4 && t < 45 ? .72 + .28 * Math.cos((t - 38.4) * 4.2) : 1;
    barLate.els[2].r.setAttribute('fill-opacity', pulse);
    $('split').setAttribute('opacity', seg(t, 39.2, 39.8));
    const sp = ease(seg(t, 39.6, 41)); const W = 1130;
    set($('splitA'), { width: Math.max(0, W * .28 * sp - 4) });
    set($('splitB'), { x: 330 + W * .28 * sp, width: Math.max(0, W * .72 * sp) });
    $('splitAT').setAttribute('opacity', seg(t, 40.8, 41.3)); $('splitBT').setAttribute('opacity', seg(t, 40.8, 41.3));

    // ---- scene 5 map
    $('mapScene').setAttribute('opacity', win(t, 45.2, 60, .6));
    if (t > 44 && t < 61) {
      const draw = (k, a, b) => { const p = ease(seg(t, a, b)); set(routes[k], { 'stroke-dasharray': `${RL[k]} ${RL[k]}`, 'stroke-dashoffset': RL[k] * (1 - p) }); };
      draw('SP', 45.8, 46.8); draw('RJ', 46.4, 47.8); draw('AL', 47.2, 48.6); draw('MA', 47.6, 49);
      const rjRed = seg(t, 48.6, 49.6); routes.RJ.setAttribute('stroke', d3mix(INK, LATE, rjRed));
      document.querySelectorAll('#map path').forEach((p) => { const uf = p.dataset.uf; if (uf === 'RJ') p.setAttribute('fill-opacity', .45 * rjRed); if (uf === 'AL' || uf === 'MA') p.setAttribute('fill-opacity', .55 * seg(t, 48.6, 49.4)); });
      const gl = seg(t, 48.6, 49.4) * (.45 + .35 * Math.sin(t * 4)); glowAL.setAttribute('opacity', gl); glowMA.setAttribute('opacity', gl);
      dots.forEach((d) => {
        const speed = d.k === 'SP' ? .35 : d.k === 'RJ' ? .32 : .18;
        const start = d.k === 'SP' ? 46.8 : d.k === 'RJ' ? 47.8 : 49;
        if (t < start) { d.el.setAttribute('opacity', 0); return; }
        const u = (((t - start) * speed + d.i / d.n) % 1); const pt = routes[d.k].getPointAtLength(u * RL[d.k]);
        set(d.el, { cx: pt.x, cy: pt.y, opacity: Math.min(1, (t - start) * 2) * (d.k === 'RJ' ? 1 : .9), fill: d.k === 'RJ' ? d3mix(INK, LATE, rjRed) : d.k === 'SP' ? INK : LATE });
      });
      labs.SP.setAttribute('opacity', seg(t, 46.8, 47.4)); labs.RJ.setAttribute('opacity', seg(t, 48.8, 49.4));
      labs.AL.setAttribute('opacity', seg(t, 49.2, 49.8)); labs.MA.setAttribute('opacity', seg(t, 49.4, 50));
      const c1 = ease(seg(t, 50.8, 51.6)), c2 = ease(seg(t, 52, 52.8));
      set($('cardRemote'), { opacity: c1, transform: `translate(0,${24 * (1 - c1)})` });
      set($('cardRio'), { opacity: c2, transform: `translate(0,${24 * (1 - c2)})` });
      $('halfText').setAttribute('opacity', seg(t, 53.6, 54.4));
      $('distChart').setAttribute('opacity', seg(t, 55, 55.6));
      distBars.forEach((b, i) => { const p = ease(seg(t, 55.4 + i * .18, 56.2 + i * .18)); set(b.r, { y: 760 - b.h * p, height: b.h * p }); });
      dl1.setAttribute('opacity', seg(t, 56.4, 57)); dl2.setAttribute('opacity', seg(t, 57.4, 58));
    }

    // ---- scene 6 trend
    $('trend').setAttribute('opacity', win(t, 60.2, 68, .6));
    set(tl, { 'stroke-dasharray': `${TL} ${TL}`, 'stroke-dashoffset': TL * (1 - inOut(seg(t, 60.8, 64))) });
    pins.forEach((p, i) => { const q = ease(seg(t, 63 + i * 1.1, 63.7 + i * 1.1)); set(p, { opacity: q, transform: `translate(0,${-16 * (1 - q)})` }); });

    // ---- scene 7 cost
    $('cost').setAttribute('opacity', win(t, 68.2, 78, .6));
    if (t > 67 && t < 79) {
      $('house').setAttribute('opacity', seg(t, 68.2, 68.8));
      const cb = inOut(seg(t, 68.4, 70)); set($('costBoxG'), { opacity: seg(t, 68.3, 68.8), transform: `translate(${lerp(760, 1070, cb)},560) scale(1.2)` });
      const rv = ease(seg(t, 70, 70.7)); set($('review'), { opacity: rv, transform: `translate(0,${20 * (1 - rv)})` });
      const filled = 4 - (t > 71.4 ? 1 : 0) - (t > 72.4 ? 1 : 0);
      stars.forEach((s, i) => {
        let o = i < 4 ? seg(t, 70.4 + i * .15, 70.7 + i * .15) : 0, dy = 0;
        if (i === 3) { const f = seg(t, 71.4, 72.1); dy = 60 * f * f; o *= 1 - f; }
        if (i === 2) { const f = seg(t, 72.4, 73.1); dy = 60 * f * f; o *= 1 - f; }
        set(s.fg, { opacity: o, transform: `translate(0,${dy})`, fill: filled <= 2 && i < 2 ? LATE : INK });
      });
      $('reviewNums').setAttribute('opacity', seg(t, 72.8, 73.5));
      $('oneStar').setAttribute('opacity', seg(t, 73.8, 74.4));
      const k1 = ease(seg(t, 74.8, 75.5)), k2 = ease(seg(t, 75.8, 76.5));
      set($('chip1'), { opacity: k1, transform: `translate(${30 * (1 - k1)},0)` }); set($('chip2'), { opacity: k2, transform: `translate(${30 * (1 - k2)},0)` });
    }

    // ---- scene 8 next
    ['n1', 'n2', 'n3'].forEach((id, i) => { const q = ease(seg(t, 79.5 + i * 1.4, 80.3 + i * 1.4)); set($(id), { opacity: q * (t < 90 ? 1 : 1), transform: `translate(0,${30 * (1 - q) + (q === 1 ? 4 * Math.sin((t - 80) * 1.6 + i) : 0)})` }); });
    pulses.forEach((c, i) => { if (t < 79) { c.setAttribute('opacity', 0); return; } const ph = ((t - 79) * .9 + i / 3) % 1; set(c, { r: 8 + 22 * ph, opacity: .55 * (1 - ph) }); });
    const ck = ease(seg(t, 86.6, 87.2)); set($('flagCheck'), { opacity: ck, transform: `translate(1290,420) scale(${.6 + .4 * ck}) translate(-1290,-420)` });
    $('final').setAttribute('opacity', seg(t, 87, 87.8)); $('sig').setAttribute('opacity', seg(t, 87.8, 88.6));
    if (t >= 78) $('promiseCounter').setAttribute('opacity', 0);
  }
  function d3mix(a, b, p) { const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16)); return 'rgb(' + pa.map((v, i) => Math.round(v + (pb[i] - v) * p)).join(',') + ')'; }

  // ---------- player ----------
  const playBtn = $('play'), scrub = $('scrub'), timeEl = $('time');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = reduce ? 26.5 : 0, playing = !reduce, last = null;
  const fmt = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const chapBox = $('chapters');
  const chapBtns = CHAPTERS.map((c, i) => { const b = document.createElement('button'); b.type = 'button'; if (c.late) b.className = 'late'; const sm = document.createElement('small'); sm.textContent = String(i + 1).padStart(2, '0') + ' · ' + fmt(c.t); const sp = document.createElement('span'); sp.textContent = c.name; b.append(sm, sp); b.addEventListener('click', () => { t = c.t + .01; if (!playing) toggle(); draw(); }); chapBox.append(b); return b; });
  function draw() {
    render(t); scrub.value = t.toFixed(1); timeEl.textContent = fmt(t) + ' / 1:30';
    const ci = CHAPTERS.findIndex((c) => t >= c.t && t < c.end); chapBtns.forEach((b, i) => b.setAttribute('aria-current', String(i === (ci < 0 ? 7 : ci))));
  }
  function toggle() { playing = !playing; if (playing && t >= DUR - .01) t = 0; last = null; playBtn.textContent = playing ? '❚❚ Pause' : '▶ Play'; playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play'); }
  playBtn.addEventListener('click', toggle);
  $('restart').addEventListener('click', () => { t = 0; if (!playing) toggle(); draw(); });
  scrub.addEventListener('input', () => { t = +scrub.value; draw(); });
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); toggle(); } });
  if (!playing) { playBtn.textContent = '▶ Play'; playBtn.setAttribute('aria-label', 'Play'); }
  function frame(now) {
    if (playing) { if (last != null) t += Math.min(.1, (now - last) / 1000); last = now; if (t >= DUR) { t = DUR - .001; playing = false; playBtn.textContent = '↺ Replay'; } draw(); } else last = null;
    requestAnimationFrame(frame);
  }
  const start = () => { draw(); requestAnimationFrame(frame); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start, start); else start();
})();
